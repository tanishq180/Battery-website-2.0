name: CI/CD Production Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Backend Checks
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Syntax & Import Checks
        run: |
          cd backend
          python -m compileall app/

      # Frontend Checks
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Run Build Check
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-production:
    name: Deploy Multi-Container Application
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Container Images
        run: |
          docker compose build

